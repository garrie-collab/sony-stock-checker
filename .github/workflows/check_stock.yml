name: Check stock

on:
  schedule:
    # Runs every 15 minutes. GitHub may delay this somewhat during busy periods.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run stock check
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
        run: python check_stock.py

      - name: Commit updated state
        run: |
          git config user.name "stock-checker-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update stock state"
          git push
